<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางยอดค้างชำระ — เดโม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#F7F9F9; --ink:#17242C; --muted:#5A6971; --line:#D5DCE0;
  --primary:#1C5DA3; --primary-ink:#FFFFFF; --primary-soft:#E6EEF8;
  --amber:#C98E00; --amber-soft:#FFF5D9; --red:#C2382C; --red-soft:#FBEBE9; --green:#2A8553; --green-soft:#E6F3EB;
  --track:#E3E8EB; --shadow:0 1px 2px rgba(23,36,44,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A1F; --surface:#18232A; --surface-2:#1D2930; --ink:#E5ECEF; --muted:#98A7AF; --line:#2B3A42;
    --primary:#6EA6E6; --primary-ink:#0E1A22; --primary-soft:#1E3043;
    --amber:#E6B23A; --amber-soft:#3A3117; --red:#F07A6E; --red-soft:#3D2220; --green:#5CC28A; --green-soft:#183326;
    --track:#2A373E; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#111A1F; --surface:#18232A; --surface-2:#1D2930; --ink:#E5ECEF; --muted:#98A7AF; --line:#2B3A42;
  --primary:#6EA6E6; --primary-ink:#0E1A22; --primary-soft:#1E3043;
  --amber:#E6B23A; --amber-soft:#3A3117; --red:#F07A6E; --red-soft:#3D2220; --green:#5CC28A; --green-soft:#183326;
  --track:#2A373E; --shadow:none;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Anuphan","Noto Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* header */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{flex:none;width:38px;height:38px;border-radius:9px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:700;letter-spacing:.5px}
.brand-name{font-weight:600;font-size:15px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-name small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.spacer{flex:1}
.user-btn{border:1px solid var(--primary);background:transparent;color:var(--primary);border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
.lang{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.user-menu{position:relative}
.user-menu .menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--surface-2)}

/* page */
main{max-width:1120px;margin:0 auto;padding:20px 16px 48px}
.page-title{margin:4px 0 2px;font-size:clamp(24px,4vw,32px);font-weight:700;letter-spacing:-.2px}
.page-sub{margin:0 0 16px;color:var(--muted)}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start;box-shadow:var(--shadow)}
.ctl-left,.ctl-right{display:grid;gap:10px}
.ctl-right{justify-items:end}
@media (max-width:640px){.ctl-right{justify-items:start}}
.controls .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.pill.role{background:var(--primary-soft);border-color:transparent;color:var(--primary);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.danger.armed{background:var(--red);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* month filter */
.mfilter{position:relative}
.mfilter summary{list-style:none;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:var(--surface);font-size:16px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:280px}
.mfilter .cap{display:block;font-size:12px;color:var(--muted);line-height:1.2}
.mfilter .val{display:block;font-weight:600;line-height:1.3}
.mfilter summary::-webkit-details-marker{display:none}
.mfilter summary::after{content:"";margin-left:auto;border:5px solid transparent;border-top-color:var(--muted);transform:translateY(3px)}
.mfilter[open] summary::after{transform:rotate(180deg) translateY(3px)}
.mfilter .panel{position:absolute;z-index:15;top:calc(100% + 6px);left:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:240px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.mfilter label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:6px;cursor:pointer}
.mfilter label:hover{background:var(--surface-2)}
.mfilter hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.mfilter input{width:18px;height:18px;accent-color:var(--primary)}

/* summary */
.totals{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0 6px}
.total{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.total span{display:block;color:var(--muted);font-size:13px}
.total strong{font-size:20px}
.total.warn strong{color:var(--red)}

/* sections */
.section-h{margin:22px 0 10px;font-size:15px;font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.carry{border:1px solid var(--red);border-radius:14px;background:var(--red-soft);padding:0 0 2px}
.carry-note{display:flex;gap:8px;align-items:flex-start;color:var(--red);font-weight:600;font-size:14px;padding:9px 14px}
.carry-note::before{content:"!";flex:none;width:20px;height:20px;border-radius:50%;background:var(--red);color:var(--surface);display:grid;place-items:center;font-size:13px;margin-top:1px}
.carry .card{border:0;border-radius:0 0 13px 13px;margin:0 2px}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--amber);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--primary);border-left-color:inherit}
.card.s-over{border-left-color:var(--red)}
.card.s-paid{border-left-color:var(--green)}
.card.s-open{border-left-color:var(--amber)}
.card-head{padding:12px 14px 0;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.card-head h3{margin:0;font-size:17px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 8px}
.card-body{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 14px 14px}
@media (min-width:640px){.card-body{grid-template-columns:260px 1fr;padding:16px 18px 18px}}
.amount-col{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding-right:4px}
@media (min-width:640px){.amount-col{border-right:1px solid var(--line);padding-right:18px;justify-content:center}}
.amount-col .lbl{font-size:13px;color:var(--muted)}
.amount{font-size:clamp(26px,3vw,30px);font-weight:700;line-height:1.15;letter-spacing:-.3px;white-space:nowrap}
.unit{font-size:14px;font-weight:600;color:var(--muted);margin-top:2px}
.link{color:var(--primary);font-weight:600;font-size:14px;background:none;border:0;padding:0;text-align:left}
.paid-big{font-size:30px;font-weight:700;color:var(--green)}
.status-tag{display:inline-block;font-size:12px;font-weight:700;border:1px solid var(--ink);border-radius:4px;padding:0 6px;margin-bottom:6px}
.bar{margin-bottom:10px}
.bar:last-child{margin-bottom:0}
.bar-top{display:flex;justify-content:space-between;gap:10px;font-size:13.5px}
.bar-top .pct{font-weight:700;flex:none}
.track{height:9px;background:var(--track);border-radius:99px;overflow:hidden;margin:4px 0 3px}
.fill{height:100%;border-radius:99px;background:var(--amber)}
.fill.over{background:var(--red)}
.fill.money{background:var(--green)}
.sub{font-size:13px;color:var(--muted)}
.sub.over,.remain{color:var(--red);font-weight:600}
.remain{font-size:14px;margin-top:4px}
.paid-info{font-size:14px;display:grid;gap:4px}
.paid-info .late{color:var(--red)}
.paid-info .ok{color:var(--green)}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;color:var(--muted)}

/* detail */
.back{margin-bottom:12px}
.acct{background:var(--primary);color:var(--primary-ink);border-radius:16px;padding:18px;display:grid;gap:4px}
.acct .name{font-size:18px;font-weight:700}
.acct .meta{opacity:.85;font-size:14px}
.acct .bal{font-size:clamp(32px,6vw,42px);font-weight:700;line-height:1.1;margin-top:8px}
.acct .bal small{font-size:16px;font-weight:500;opacity:.85;margin-left:4px}
.acct .of{opacity:.85;font-size:14px}
.detail-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media (min-width:900px){.detail-grid{grid-template-columns:1fr 1.2fr}}
.panel-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel-box h2{font-size:16px;margin:0 0 10px}
.txn-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.txn-head h2{margin:0}
.txn-head select{margin-left:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--surface)}
.txns{list-style:none;margin:0;padding:0}
.txn{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.txn:last-child{border-bottom:0}
.txn .dot{flex:none;width:10px;height:10px;border-radius:50%;border:2px solid var(--muted)}
.txn .what{flex:1;min-width:0}
.txn .what b{display:block;font-weight:600}
.txn .what span{font-size:13px;color:var(--muted)}
.txn .amt{color:var(--green);font-weight:700;white-space:nowrap}
.txn.editable{cursor:pointer;border-radius:8px}
.txn.editable:hover{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-box{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.login-box h1{margin:12px 0 4px;font-size:22px}
.login-box p{margin:0 0 18px;color:var(--muted)}
.role-btn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:14px;margin-bottom:10px}
.role-btn:hover{border-color:var(--primary)}
.role-btn b{display:block;font-size:16px}
.role-btn span{font-size:14px;color:var(--muted)}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 32px);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,18,24,.5)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.dlg-h h2{margin:0;font-size:18px;flex:1}
.dlg-b{padding:16px 18px;display:grid;gap:12px}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 18px 18px}
.dlg-f .left{margin-right:auto}
.field{display:grid;gap:4px}
.field label,.field .lab{font-size:14px;font-weight:600}
.field input,.field select{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:var(--surface);width:100%}
.field .hint{font-size:12.5px;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;gap:8px}
.seg label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;font-weight:500}
.seg input{accent-color:var(--primary)}
.seg label:has(input:checked){border-color:var(--primary);background:var(--primary-soft)}
.err{color:var(--red);font-size:14px;font-weight:600;min-height:1em}
.preview{background:var(--surface-2);border-radius:8px;padding:8px 10px;font-size:14px}
.co-list{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.co-list li{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.co-list li:last-child{border-bottom:0}
.co-list span{color:var(--muted)}
.close-x{border:0;background:transparent;font-size:22px;line-height:1;padding:4px 8px;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);z-index:50}
.toast.show{opacity:1;transform:translateX(-50%)}
.demo-note{max-width:1120px;margin:0 auto;padding:0 16px 24px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

const diff = (a,b) => Math.round((toMs(b)-toMs(a))/DAY);       // b - a in days
const addDays = (s,n) => new Date(toMs(s)+n*DAY).toISOString().slice(0,10);
const mk = s => s.slice(0,7);
const clamp = x => Math.max(0, Math.min(1, x));
const r2 = x => Math.round(x*100)/100;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

/* ---------- i18n ---------- */

  fCstart:'วันเริ่มนับเครดิต', fAstart:'วันเริ่มนับวันจริง', fAdue:'วันครบกำหนดจริง',

const company = id => DB.companies.find(c => c.id === id);
const paysOf = recId => DB.payments.filter(p => p.recId === recId && !p.cancelled).sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));
function calc(r){
  const pays = paysOf(r.id);
  const paid = r2(pays.reduce((s,p) => s + p.amount, 0));
  const balance = r2(r.total - paid);
  const creditDue = addDays(r.creditStart, r.creditDays);
  const isPaid = balance <= 0.004;
  const paidDate = isPaid && pays.length ? pays[pays.length-1].date : null;
  return {
    pays, paid, balance, creditDue, isPaid, paidDate,
    actualPct: clamp(diff(r.actualStart, TODAY) / Math.max(1, diff(r.actualStart, r.actualDue))),
    creditPct: clamp(diff(r.creditStart, TODAY) / Math.max(1, r.creditDays)),
    moneyPct: clamp(paid / r.total),
    toActual: diff(TODAY, r.actualDue),
    toCredit: diff(TODAY, creditDue),
    carried: !isPaid && mk(r.actualDue) < mk(TODAY),
  };
}
const liveRecs = () => DB.receivables.filter(r => !r.cancelled);
const pct = x => Math.round(x*100);

function audit(action, oldV, newV){

}

    <section class="panel-box">
      <h2>${t('status')}</h2>
      ${c.isPaid ? `<div class="paid-info"><span>${t('paidOn',{d:fmtD(c.paidDate,true)})}</span>${lateLine(r.actualDue,c.paidDate,'a')}${lateLine(c.creditDue,c.paidDate,'c')}</div>
        <p><button class="btn" data-act="summary" data-id="${r.id}">${t('summary')}</button></p>` : barsView(r,c)}
      <h2 style="margin-top:18px">${t('info')}</h2>
      <dl class="kv num">
        <dt>${t('fCstart')}</dt><dd>${fmtD(r.creditStart,true)}</dd>
        <dt>${t('fCdays')}</dt><dd>${r.creditDays}</dd>
        <dt>${t('creditDue',{d:''})}</dt><dd>${fmtD(c.creditDue,true)}</dd>
        <dt>${t('fAstart')}</dt><dd>${fmtD(r.actualStart,true)}</dd>
        <dt>${t('fAdue')}</dt><dd>${fmtD(r.actualDue,true)}</dd>
      </dl>
      ${isSales ? `<p style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0">
        ${c.isPaid?'':`<button class="btn primary" data-act="addPay" data-id="${r.id}">+ ${t('addPay')}</button>`}
        <button class="btn" data-act="editRec" data-id="${r.id}">${t('editRec')}</button></p>` : ''}
    </section>
    <section class="panel-box">
      <div class="txn-head"><h2>${t('incoming')}</h2>
        <select data-paymonth aria-label="month"><option value="all">${t('all')}</option>${months.map(m=>`<option value="${m}" ${S.payMonth===m?'selected':''}>${fmtM(m,true)}</option>`).join('')}</select></div>
      ${c.pays.length===0 ? `<div class="empty">${t('noPay')}</div>` : (shown.length ? `<ul class="txns">${txns}</ul>` : `<div class="empty">${t('noPayMonth')}</div>`)}
    </section>
  </div>`;
}

/* ---------- dialogs ---------- */
const dlg = document.getElementById('dlg');
function openDlg(title, body, foot){
  dlg.innerHTML = `<div class="dlg-h"><h2 id="dlg-title">${title}</h2><button class="close-x" data-act="close" aria-label="${t('cancel')}">×</button></div>
    <div class="dlg-b">${body}</div><div class="dlg-f">${foot}</div>`;
  dlg.showModal();
}
function recForm(id){
  const r = id ? DB.receivables.find(x => x.id === id) : null;
  const v = r ? {...r, company:company(r.companyId).name} : {company:'', acct:'2026-09', total:'', creditDays:60, creditStart:'', actualStart:'', actualDue:''};
  openDlg(r ? t('editRec') : t('addRec'), `
    <div class="field"><label for="f-company">${t('fCompany')}</label>
      <input id="f-company" list="co-dl" value="${esc(v.company)}" autocomplete="off"><span class="hint">${t('fCompanyHint')}</span>
      <datalist id="co-dl">${DB.companies.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div>
    <div class="row2">
      <div class="field"><label for="f-acct">${t('fAcct')}</label><input id="f-acct" type="month" value="${v.acct}"></div>
      <div class="field"><label for="f-total">${t('fTotal')}</label><input id="f-total" type="number" inputmode="decimal" step="0.01" min="0" value="${v.total}"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="f-cdays">${t('fCdays')}</label><input id="f-cdays" type="number" min="1" value="${v.creditDays}"></div>
      <div class="field"><label for="f-cstart">${t('fCstart')}</label><input id="f-cstart" type="date" value="${v.creditStart}"></div>
    </div>
    <div class="preview num" id="f-preview"></div>
    <div class="row2">
      <div class="field"><label for="f-astart">${t('fAstart')}</label><input id="f-astart" type="date" value="${v.actualStart}"></div>
      <div class="field"><label for="f-adue">${t('fAdue')}</label><input id="f-adue" type="date" value="${v.actualDue}"></div>
    </div>
    <span class="hint" style="font-size:12.5px;color:var(--muted)">${t('fAdueHint')}</span>
    <div class="err" id="f-err"></div>`,
    `${r ? `<button class="btn danger left" data-act="cancelRec" data-id="${r.id}">${t('cancelRec')}</button>` : ''}
     <button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="saveRec" data-id="${r?r.id:''}">${t('save')}</button>`);
  const upd = () => {
    const s = document.getElementById('f-cstart').value, n = +document.getElementById('f-cdays').value;
    document.getElementById('f-preview').textContent = (s && n>0) ? t('previewCredit',{d:fmtD(addDays(s,n),true)}) : t('previewCredit',{d:'–'});
  };
  ['f-cstart','f-cdays'].forEach(i => document.getElementById(i).addEventListener('input', upd)); upd();
}
function saveRec(id){
  const g = i => document.getElementById(i).value.trim();
  const name = g('f-company'), acct = g('f-acct'), total = parseFloat(g('f-total')), cd = parseInt(g('f-cdays')),
        cs = g('f-cstart'), as = g('f-astart'), ad = g('f-adue'), err = document.getElementById('f-err');
  if(!name || !acct || !cs || !as || !ad || isNaN(total) || isNaN(cd)) return err.textContent = t('eRequired');
  if(total <= 0) return err.textContent = t('eTotal');
  if(cd <= 0) return err.textContent = t('eDays');
  if(ad < as) return err.textContent = t('eDue');
  let co = DB.companies.find(c => c.name === name);
  if(!co){ co = {id:nid('c'), name}; DB.companies.push(co); audit('company.create', null, co); }
  const data = {companyId:co.id, acct, total:r2(total), creditDays:cd, creditStart:cs, actualStart:as, actualDue:ad};
  if(id){ const r = DB.receivables.find(x => x.id === id); const old = {...r}; Object.assign(r, data); audit('receivable.update', old, r); }
  else { const r = {id:nid('r'), ...data}; DB.receivables.push(r); audit('receivable.create', null, r); }
  dlg.close(); toast(t('savedRec')); render();
}
function payForm(recId, payId){
  const p = payId ? DB.payments.find(x => x.id === payId) : null;
  const r = DB.receivables.find(x => x.id === (p ? p.recId : recId));
  const c = calc(r);
  const v = p || {amount:'', method:'transfer', date:TODAY, time:'10:00'};
  openDlg(p ? t('editPay') : t('addPay'), `
    <div class="preview">${esc(company(r.companyId).name)}<br><span class="num">${t('balanceNow',{a:money(c.balance)})}</span></div>
    <div class="field"><label for="f-amt">${t('fAmt')}</label><input id="f-amt" type="number" inputmode="decimal" step="0.01" min="0" value="${v.amount}"></div>
    <div class="field"><span class="lab">${t('fMethod')}</span><div class="seg">
      <label><input type="radio" name="f-method" value="transfer" ${v.method==='transfer'?'checked':''}>${t('transfer')}</label>
      <label><input type="radio" name="f-method" value="cheque" ${v.method==='cheque'?'checked':''}>${t('cheque')}</label></div></div>
    <div class="row2">
      <div class="field"><label for="f-date" id="f-date-l">${v.method==='cheque'?t('fDateC'):t('fDateT')}</label><input id="f-date" type="date" value="${v.date}"></div>
      <div class="field"><label for="f-time">${t('fTime')}</label><input id="f-time" type="time" value="${v.time}"></div>
    </div>
    <div class="err" id="f-err"></div>`,
    `${p ? `<button class="btn danger left" data-act="cancelPay" data-id="${p.id}">${t('cancelPay')}</button>` : ''}
     <button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="savePay" data-rec="${r.id}" data-id="${p?p.id:''}">${t('save')}</button>`);
  dlg.querySelectorAll('input[name="f-method"]').forEach(x => x.addEventListener('change', () => {
    document.getElementById('f-date-l').textContent = x.value === 'cheque' ? t('fDateC') : t('fDateT');
  }));
}
function savePay(recId, payId){
  const amt = parseFloat(document.getElementById('f-amt').value), date = document.getElementById('f-date').value,
        time = document.getElementById('f-time').value, method = dlg.querySelector('input[name="f-method"]:checked').value,
        err = document.getElementById('f-err');
  if(isNaN(amt) || !date || !time) return err.textContent = t('eRequired');
  if(amt <= 0) return err.textContent = t('eAmt');
  const r = DB.receivables.find(x => x.id === recId), c = calc(r);
  const p = payId ? DB.payments.find(x => x.id === payId) : null;
  const room = r2(c.balance + (p ? p.amount : 0));
  if(amt > room + 0.004) return err.textContent = t('eOver',{a:money(room)});
  if(p){ const old = {...p}; Object.assign(p, {amount:r2(amt), date, time, method}); audit('payment.update', old, p); }
  else { const np = {id:nid('p'), recId, amount:r2(amt), date, time, method}; DB.payments.push(np); audit('payment.create', null, np); }
  dlg.close(); toast(t('savedPay')); render();
}
function summaryDlg(id){
  const r = DB.receivables.find(x => x.id === id), c = calc(r);
  openDlg(`${t('sumH')}: ${esc(company(r.companyId).name)}`, `
    <dl class="kv num">
      <dt>${t('sumPaidOn')}</dt><dd>${fmtD(c.paidDate,true)}</dd>
      <dt>${t('sumCount')}</dt><dd>${t('times',{n:c.pays.length})}</dd>
      <dt>${t('sumVsActual')}</dt><dd>${lateLine(r.actualDue,c.paidDate,'a')}</dd>
      <dt>${t('sumVsCredit')}</dt><dd>${lateLine(c.creditDue,c.paidDate,'c')}</dd>
    </dl>
    <ul class="txns">${c.pays.map(p => `<li class="txn"><span class="dot"></span><div class="what"><b>${p.method==='transfer'?t('transfer'):t('cheque')}</b>
      <span class="num">${fmtD(p.date,true)} ${p.time}</span></div><div class="amt num">+${money(p.amount)}</div></li>`).join('')}</ul>`,
    `<button class="btn primary" data-act="close">${t('cancel')}</button>`);
}
function companiesDlg(){
  const open = id => liveRecs().filter(r => r.companyId === id && !calc(r).isPaid).length;
  openDlg(t('coH'), `
    <ul class="co-list">${DB.companies.slice().sort((a,b)=>a.name.localeCompare(b.name,'th')).map(c => `<li>${esc(c.name)}<span>${t('coOpen',{n:open(c.id)})}</span></li>`).join('')}</ul>
    <div class="field"><label for="f-co">${t('coName')}</label><input id="f-co" autocomplete="off"></div>
    <div class="err" id="f-err"></div>`,
    `<button class="btn" data-act="close">${t('cancel')}</button><button class="btn primary" data-act="addCo">${t('coAdd')}</button>`);
}

/* ---------- events ---------- */
function arm(b){ b.dataset.armed = '1'; b.textContent = t('confirmAgain'); b.classList.add('armed'); const e = document.getElementById('f-err'); if(e) e.textContent = t('confirmCancel'); }
let toastTimer;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2400); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if(S.userMenu && !e.target.closest('.user-menu')){ S.userMenu = false; if(!b) return render(); }
  if(!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch(a){
    case 'login': S.role = b.dataset.role; S.view = 'list'; render(); break;
    case 'logout': S.role = null; S.userMenu = false; render(); break;
    case 'usermenu': S.userMenu = !S.userMenu; render(); break;
    case 'lang': S.lang = b.dataset.lang; render(); break;
    case 'open': S.view = 'detail'; S.recId = id; S.payMonth = 'all'; render(); window.scrollTo(0,0); break;
    case 'back': S.view = 'list'; render(); break;
    case 'summary': e.stopPropagation(); summaryDlg(id); break;
    case 'export': toast(t('exportDemo',{f:b.dataset.f})); break;
    case 'addRec': recForm(null); break;
    case 'editRec': recForm(id); break;
    case 'saveRec': saveRec(id); break;
    case 'cancelRec': if(!b.dataset.armed){ arm(b); break; } { const r = DB.receivables.find(x=>x.id===id); const old={...r}; r.cancelled = true; audit('receivable.cancel', old, r); dlg.close(); S.view='list'; toast(t('cancelled')); render(); } break;
    case 'addPay': payForm(id, null); break;
    case 'editPay': payForm(null, id); break;
    case 'savePay': savePay(b.dataset.rec, id); break;
    case 'cancelPay': if(!b.dataset.armed){ arm(b); break; } { const p = DB.payments.find(x=>x.id===id); const old={...p}; p.cancelled = true; audit('payment.cancel', old, p); dlg.close(); toast(t('cancelled')); render(); } break;
    case 'companies': companiesDlg(); break;
    case 'addCo': {
      const name = document.getElementById('f-co').value.trim(), err = document.getElementById('f-err');
      if(!name) { err.textContent = t('eRequired'); break; }
      if(DB.companies.some(c => c.name === name)) { err.textContent = t('coExists'); break; }
      const co = {id:nid('c'), name}; DB.companies.push(co); audit('company.create', null, co); toast(t('coAdded')); companiesDlg(); break;
    }
    case 'close': dlg.close(); break;
  }
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-act="open"],[data-act="editPay"]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', e => {
  const m = e.target.dataset.month;
  if(m !== undefined){
    if(m === '__all') S.months.clear();
    else e.target.checked ? S.months.add(m) : S.months.delete(m);
    render(); document.querySelector('.mfilter')?.setAttribute('open','');
  } else if(e.target.hasAttribute('data-unpaid')){
    S.unpaidOnly = e.target.checked; render(); document.querySelector('.mfilter')?.setAttribute('open','');
  } else if(e.target.hasAttribute('data-paymonth')){
    S.payMonth = e.target.value; render();
  }
});
render();
</script>
</body>
</html>
